name: 🔍 Verify

on:
  workflow_call:
    inputs:
      display_name:
        type: string
        required: true
      version:
        type: string
        required: true
      os:
        type: string
        required: true
      host_profile:
        type: string
        default: ""

env:
  VERBOSE: "1"

jobs:
  verify:
    name: ${{ inputs.display_name }}
    strategy:
      fail-fast: false

    runs-on: ${{ inputs.os }}
    env:
      HOST_PROFILE: ${{ inputs.host_profile && format('-pr {0}', inputs.host_profile) || '' }}
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: true
          fetch-depth: 0

      - name: 🍎 Update Xcode Command Line Tools (keeps the SDK in sync with the OS)
        if: ${{ contains(inputs.os, 'macos') }}
        run: |
          LABEL=$(softwareupdate --list 2>&1 | awk -F': ' '/Label:.*Command Line Tools/ {print $2}' | tail -1 | xargs)
          if [ -n "$LABEL" ]; then
            echo "Installing: $LABEL"
            sudo softwareupdate --install "$LABEL" --agree-to-license
          else
            echo "Command Line Tools already up to date"
          fi

      - name: 📥 Install CMake & Conan
        run: pipx install conan>=2.18.0

      - name: 📡 Add `libhal` conan remote
        run: |
          conan remote add libhal https://libhal.jfrog.io/artifactory/api/conan/trunk-conan

      - name: 📡 Create and setup default profile
        run: conan profile detect --force

      - name: 👁️‍🗨️ Show conan profile
        run: conan profile show

      - name: 📡 Install libhal conan configurations
        run: conan config install https://github.com/libhal/conan-config2.git

      - name: 📡 Install local toolchain profiles
        run: conan config install -tf profiles/ -sf conan/profiles/v1/ .

      - name: 🔧 Register newer clang versions with Conan
        # Conan's own bundled settings.yml enumerates valid
        # settings.compiler.version values for clang and lags behind new
        # LLVM releases (as of Conan 2.27.0 it only goes up to "22"). Until
        # Conan ships a release that recognizes newer clang versions,
        # extend settings_user.yml ourselves so `compiler.version=23` (etc.)
        # in our profiles doesn't get rejected as an "Invalid setting".
        # Uses `shell: python` for cross-platform (Linux/macOS/Windows)
        # portability without shell-quoting headaches.
        shell: python
        run: |
          import subprocess
          import pathlib

          home = subprocess.run(
              ["conan", "config", "home"],
              capture_output=True, text=True, check=True
          ).stdout.strip()
          path = pathlib.Path(home) / "settings_user.yml"
          text = path.read_text() if path.exists() else ""

          NEW_CLANG_VERSIONS = ["23"]
          missing = [v for v in NEW_CLANG_VERSIONS if f'"{v}"' not in text]
          if missing:
              versions = ", ".join(f'"{v}"' for v in missing)
              text += f'\ncompiler:\n  clang:\n    version: [{versions}]\n'
              path.write_text(text)

          print(f"--- {path} ---")
          print(path.read_text())

      - name: 📦 Create LLVM Toolchain Package (native build)
        if: ${{ inputs.host_profile == '' }}
        run: conan create all --version=${{ inputs.version }} --build-require --build=cmake --build=missing:cmake/* --build=make --build=missing:make/*

      - name: 📦 Create LLVM Toolchain Package (cross build)
        if: ${{ inputs.host_profile != '' }}
        run: conan create all -pr:h llvm-${{ inputs.version }} ${{ inputs.host_profile }} --version=${{ inputs.version }} --build-require --build=cmake --build=missing:cmake/* --build=make --build=missing:make/*

      - name: ⚙️ Build/Install ninja from scratch using LLVM for build platform
        run: >
          conan install --tool-requires="ninja/1.13.2" --build="ninja/*" -pr:a llvm-${{ inputs.version }} --build=cmake --build=missing:cmake/*

      - name: 📦 Build C++ demo using  LLVM toolchain
        run: conan build demos/cpp -pr:a llvm-${{ inputs.version }} ${{ inputs.host_profile }}

      - name: 📦 Build C++ modules demo using LLVM toolchain
        run: conan build demos/cpp-modules -pr:a llvm-${{ inputs.version }} ${{ inputs.host_profile }}
